name: Browser tool · Check and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test the application
        run: node --test tests/*.test.mjs
      - name: Test the builder
        run: python3 -m unittest discover -s tests -v
      - name: Build the static application
        run: python3 scripts/build.py
      - name: Check whether the tool has been initialized
        id: identity
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python3 - <<'PY'
          import json, os
          tool_id = json.load(open('tool.json'))['id']
          ready = tool_id != 'coolcode-tool-template' and tool_id == os.environ['REPOSITORY_NAME']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'publish={str(ready).lower()}\n')
          PY
      - name: Install browser test dependencies
        run: |
          python3 -m pip install -r tests/browser-requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Check application in a browser
        run: python3 tests/browser_smoke.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: browser-checks/
          retention-days: 7
      - name: Save reviewable site
        uses: actions/upload-artifact@v4
        with:
          name: browser-tool-preview
          path: dist/
          include-hidden-files: true
          retention-days: 7
      - name: Package Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.identity.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  visual-review:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check Percy configuration
        id: config
        env:
          ENABLED: ${{ secrets.PERCY_TOKEN != '' }}
        run: |
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [[ "$ENABLED" != true ]]; then
            echo 'Percy is inactive. Download browser-checks for both visual snapshots.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v6
        if: steps.config.outputs.enabled == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          name: browser-checks
          path: browser-checks
      - name: Upload fixed views to Percy
        if: steps.config.outputs.enabled == 'true'
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_BRANCH: ${{ github.head_ref || github.ref_name }}
          PERCY_TARGET_BRANCH: ${{ github.base_ref }}
          PERCY_PULL_REQUEST: ${{ github.event.pull_request.number }}
          PERCY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx --yes --package=@percy/cli@1.33.1 percy upload browser-checks/percy
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: publish
