name: Refresh public dataset
on:
  push:
    branches: [main]
    paths: ['scripts/refresh.py', '.github/workflows/refresh.yml']
  schedule:
    - cron: '33 10 4 * *'
  workflow_dispatch:
concurrency:
  group: source-refresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Microsoft Access reader
        run: sudo apt-get update && sudo apt-get install -y mdbtools
      - run: python3 scripts/refresh.py
      - run: python3 -m unittest discover -s tests && node --test tests/*.test.mjs && python3 scripts/build.py
      - name: Save and publish the verified edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- web/data; then
            git add web/data
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Refresh published source records"
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          elif [ "${GITHUB_RUN_ATTEMPT}" -gt 1 ]; then
            gh workflow run pages.yml --ref main
          fi
